services:
  maildev:
    image: maildev/maildev
    container_name: maildev_test
    ports:
      - "1060:1080"
      - "1025:1025"

  postgres:
    image: postgis/postgis:17-3.4
    container_name: postgres_postgis_test
    restart: always
    environment:
      POSTGRES_USER: proiectIP
      POSTGRES_PASSWORD: proiectIP
      POSTGRES_DB: proiectIP
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proiectIP -d proiectIP"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - postgres_data_test:/var/lib/postgresql/data

volumes:
  postgres_data_test:
