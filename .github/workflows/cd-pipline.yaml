name: CD Pipeline

#Triggered after CI pipeline completes successfully
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  #Deployment job
  deploy:
    #Deployment triggers only if CI-Pipeline checks successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy BE to Railway
    runs-on: ubuntu-latest

    #Workflow timeout after 5 minutes
    timeout-minutes: 5

    steps:
      #Moving the workflow on the VM
      - name: Checkout
        uses: actions/checkout@v4

      #Bun setup
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      #Dependecies intalation
      - name: Install dependencies
        run: bun install

      #Railway CLI on VM for deployment
      - name: Install Railway CLI
        run: bun install -g @railway/cli

      #1. Deploy BE service
      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      
      #2. Redeploy NGINX service for fresh BE intern URL
      - name: Redeploy Nginx Proxy
        run: railway redeploy --service ${{ secrets.RAILWAY_NGINX_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}